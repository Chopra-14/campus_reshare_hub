<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Campus ReShare Hub — Sign In</title>
<script>(function(){ var t=localStorage.getItem('theme')||'dark'; document.documentElement.setAttribute('data-theme',t); })();</script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
::-webkit-scrollbar { display:none; }
* { scrollbar-width:none; -ms-overflow-style:none; }

/* ── CSS VARIABLES ── */
[data-theme="dark"] {
  --bg:#0d0920; --bg2:#14102e; --bg3:#1d1845;
  --fg:#ede8ff; --fg2:rgba(210,195,255,0.55); --fg3:rgba(180,160,255,0.3);
  --purple:#8b5cf6; --purple-hi:#a78bfa; --purple-lo:rgba(139,92,246,0.15);
  --teal:#10d9a8; --teal-lo:rgba(16,217,168,0.12);
  --border:rgba(139,92,246,0.18); --ring:rgba(139,92,246,0.12);
  --nav-bg:rgba(13,9,32,0.82); --card-bg:rgba(29,24,69,0.7);
  --stat-bg:rgba(139,92,246,0.08); --shadow:rgba(139,92,246,0.25);
  --divider:rgba(139,92,246,0.12);
}

[data-theme="light"] {
  --bg:#f0ecff; --bg2:#e8e2ff; --bg3:#ddd5ff;
  --fg:#1a0e3a; --fg2:rgba(60,40,120,0.65); --fg3:rgba(80,50,160,0.35);
  --purple:#7c3aed; --purple-hi:#6d28d9; --purple-lo:rgba(124,58,237,0.12);
  --teal:#0d9488; --teal-lo:rgba(13,148,136,0.12);
  --border:rgba(124,58,237,0.2); --ring:rgba(124,58,237,0.1);
  --nav-bg:rgba(240,236,255,0.88); --card-bg:rgba(255,255,255,0.8);
  --stat-bg:rgba(124,58,237,0.06); --shadow:rgba(124,58,237,0.18);
  --divider:rgba(124,58,237,0.12);
}

/* ── Theme toggle button ── */
.theme-toggle-btn {
  position:fixed; top:14px; right:18px; z-index:999;
  background:var(--purple-lo); border:1px solid var(--border);
  color:var(--purple-hi); border-radius:50%;
  width:38px; height:38px; font-size:17px;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:all 0.25s;
}
.theme-toggle-btn:hover { background:rgba(139,92,246,0.25); transform:rotate(20deg) scale(1.1); }

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--fg);
  font-family: 'DM Sans', sans-serif;
  overflow: hidden;
}

/* ── BACKGROUND BLOBS (same as main page) ── */
.blob { position:fixed; border-radius:50%; filter:blur(90px); pointer-events:none; z-index:0; }
.blob-1 { width:520px;height:520px;top:-120px;right:-80px;  background:radial-gradient(circle,rgba(139,92,246,0.22) 0%,transparent 70%); }
.blob-2 { width:400px;height:400px;bottom:-80px;left:-60px; background:radial-gradient(circle,rgba(16,217,168,0.12) 0%,transparent 70%); }
.blob-3 { width:300px;height:300px;top:40%;left:35%;        background:radial-gradient(circle,rgba(139,92,246,0.08) 0%,transparent 70%); }

/* ── STAR / PARTICLE CANVAS ── */
#star-canvas {
  position:fixed; inset:0; pointer-events:none; z-index:0; opacity:0.75;
}

/* ── NEBULA SWEEP (purple/teal tones) ── */
.nebula {
  position:fixed; inset:0; z-index:1; pointer-events:none;
  background:
    radial-gradient(ellipse 80% 45% at 55% 55%, rgba(80,20,160,0.18) 0%, transparent 70%),
    radial-gradient(ellipse 55% 60% at 75% 28%, rgba(40,10,90,0.22) 0%, transparent 65%),
    radial-gradient(ellipse 35% 35% at 20% 75%, rgba(16,217,168,0.06) 0%, transparent 70%);
}

/* ── PLANET (purple theme) ── */
.planet {
  position:fixed; top:-150px; right:-150px;
  width:540px; height:540px; border-radius:50%;
  background: radial-gradient(circle at 36% 30%,
    #1a0840 0%, #0d0428 35%, #060118 60%, #010008 100%);
  box-shadow:
    inset -50px -50px 90px rgba(139,92,246,0.35),
    inset  18px  18px 70px rgba(0,0,0,0.92),
    0 0 160px rgba(139,92,246,0.14),
    0 0  60px rgba(139,92,246,0.08);
  animation: planetDrift 13s ease-in-out infinite alternate;
  pointer-events:none; z-index:2;
}
.planet::before {
  content:''; position:absolute; inset:0; border-radius:50%;
  background: radial-gradient(ellipse at 68% 36%, rgba(167,139,250,0.22) 0%, transparent 55%);
}
.planet::after {
  content:''; position:absolute; top:10%; left:7%;
  width:68%; height:52%; border-radius:50%;
  background: radial-gradient(ellipse, rgba(16,217,168,0.07) 0%, transparent 70%);
  filter:blur(14px);
}
@keyframes planetDrift {
  0%   { transform:translate(0,0) rotate(0deg); }
  100% { transform:translate(-14px,20px) rotate(5deg); }
}

/* teal ring on planet edge */
.planet-ring {
  position:fixed; top:-158px; right:-158px;
  width:556px; height:556px; border-radius:50%;
  border:1px solid rgba(16,217,168,0.08);
  pointer-events:none; z-index:3;
  animation: planetDrift 13s ease-in-out infinite alternate;
}

/* ── LOGO MASCOT ANIMATION ── */
.logo-mascot {
  position:fixed; bottom:20px; left:2vw;
  width:220px; z-index:10; pointer-events:none;
  animation: mascotFloat 5s ease-in-out infinite;
  filter: drop-shadow(0 18px 50px rgba(139,92,246,0.5))
          drop-shadow(0 0 30px rgba(16,217,168,0.2));
}
@keyframes mascotFloat {
  0%,100% { transform:translateY(0) rotate(-0.5deg) scale(1); }
  50%      { transform:translateY(-18px) rotate(0.5deg) scale(1.02); }
}
/* spinning recycling ring */
.ring-spin {
  transform-origin: 110px 110px;
  animation: ringRotate 8s linear infinite;
}
@keyframes ringRotate {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
/* cap bounce */
.cap-bounce {
  transform-origin: 110px 48px;
  animation: capBob 2.5s ease-in-out infinite;
}
@keyframes capBob {
  0%,100% { transform: translateY(0); }
  50%      { transform: translateY(-6px); }
}
/* tassel swing */
.tassel-swing {
  transform-origin: 136px 52px;
  animation: tasselSwing 2.5s ease-in-out infinite;
}
@keyframes tasselSwing {
  0%,100% { transform: rotate(-8deg); }
  50%      { transform: rotate(8deg); }
}
/* figure pulse */
.fig-left  { animation: figPulse 3s ease-in-out infinite; }
.fig-right { animation: figPulse 3s 0.8s ease-in-out infinite; }
@keyframes figPulse {
  0%,100% { opacity:1; }
  50%      { opacity:0.7; }
}
/* glow circle behind logo */
.mascot-glow {
  position:fixed; bottom:-30px; left:calc(2vw - 30px);
  width:280px; height:280px; border-radius:50%;
  background:radial-gradient(circle, rgba(139,92,246,0.18) 0%, transparent 70%);
  pointer-events:none; z-index:9;
  animation: glowPulse 4s ease-in-out infinite;
}
@keyframes glowPulse {
  0%,100% { transform:scale(1); opacity:0.8; }
  50%      { transform:scale(1.12); opacity:0.5; }
}
/* teal orbit dot */
.orbit-dot {
  position:fixed; z-index:11; pointer-events:none;
  width:10px; height:10px; border-radius:50%;
  background:var(--teal);
  box-shadow: 0 0 12px var(--teal);
  animation: orbitAnim 4s linear infinite;
  bottom: 130px; left: calc(2vw + 105px);
  transform-origin: 0px 80px;
}
@keyframes orbitAnim {
  from { transform: rotate(0deg) translateX(88px); }
  to   { transform: rotate(360deg) translateX(88px); }
}

/* ── NAV (same as main page) ── */
nav {
  position:fixed; top:0; left:0; right:0; z-index:200;
  display:flex; align-items:center; justify-content:space-between;
  padding:1.2rem 3rem;
  background:var(--nav-bg);
  backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
}
.nav-logo { display:flex; align-items:center; gap:0.7rem; text-decoration:none; cursor:pointer; }
.logo-icon { width:34px;height:34px;border-radius:8px; background:var(--purple-lo); border:1px solid var(--border); display:flex;align-items:center;justify-content:center;font-size:1rem; }
.logo-text { font-family:'Calibri',Georgia,serif; font-size:1rem; font-weight:700; color:var(--fg); }
.logo-text span { color:var(--purple-hi); }
.nav-pill { font-family:'Space Mono',monospace; font-size:0.6rem; letter-spacing:0.12em; padding:0.35rem 0.85rem; border-radius:100px; background:var(--purple-lo); color:var(--purple-hi); border:1px solid var(--border); }

/* ── BACK BUTTON (top-left) ── */
.back-btn {
  position:fixed; top:5.5rem; left:1.8rem; z-index:50;
  display:inline-flex; align-items:center; gap:0.5rem;
  background:none; border:none; cursor:pointer; text-decoration:none;
  font-family:'DM Sans',sans-serif; font-size:0.88rem; font-weight:500;
  color:var(--fg2); transition:color 0.2s;
}
.back-btn:hover { color:var(--purple-hi); }
.back-btn svg { transition:transform 0.2s; }
.back-btn:hover svg { transform:translateX(-3px); }

/* ── CENTER WRAPPER ── */
.center {
  position:relative; z-index:20;
  height:100vh;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:1.5rem; padding:0 1rem;
  animation: riseIn 0.75s cubic-bezier(0.22,1,0.36,1) forwards;
}
@keyframes riseIn {
  from { opacity:0; transform:translateY(28px); }
  to   { opacity:1; transform:translateY(0); }
}

/* ── LOGO BLOCK ── */
.logo-wrap {
  display:flex; flex-direction:column; align-items:center; gap:0.75rem;
}
.logo-icon-big {
  position:relative; width:64px; height:64px; border-radius:18px;
  background:linear-gradient(138deg, var(--purple) 0%, #6d28d9 100%);
  display:flex; align-items:center; justify-content:center;
  font-size:1.6rem;
  box-shadow: 0 8px 36px var(--shadow), 0 2px 8px rgba(0,0,0,0.4);
  overflow:hidden;
}
.logo-icon-big::before {
  content:'';
  position:absolute; inset:0; border-radius:inherit;
  background:linear-gradient(135deg,rgba(255,255,255,0.22) 0%,transparent 55%);
}
/* pulse rings */
.logo-ring {
  position:absolute; inset:-7px; border-radius:24px;
  border:1.5px solid rgba(139,92,246,0.45);
  animation: ringPulse 2.8s ease-in-out infinite;
}
.logo-ring-2 {
  position:absolute; inset:-14px; border-radius:28px;
  border:1px solid rgba(139,92,246,0.2);
  animation: ringPulse 2.8s 0.5s ease-in-out infinite;
}
@keyframes ringPulse {
  0%,100% { transform:scale(1); opacity:0.6; }
  50%      { transform:scale(1.08); opacity:0; }
}
.brand-name {
  font-family:'Space Mono',monospace; font-size:1rem; font-weight:700;
  letter-spacing:0.3em; color:var(--fg);
  text-shadow: 0 0 40px rgba(139,92,246,0.35);
}
.brand-sub {
  font-family:'Space Mono',monospace; font-size:0.58rem;
  letter-spacing:0.26em; color:var(--fg3);
  margin-top:-0.7rem;
}

/* ── SUBTITLE / STEP TAG ── */
.subtitle {
  display:inline-flex; align-items:center; gap:0.5rem;
  font-family:'Space Mono',monospace; font-size:0.62rem;
  letter-spacing:0.2em; color:var(--teal);
}
.subtitle-dot { width:6px;height:6px;border-radius:50%;background:var(--teal); animation:blink 2s ease-in-out infinite; }
@keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

/* ── ROLE BUTTONS ── */
.roles { display:flex; gap:2.4rem; margin:0.4rem 0; }

.role-btn {
  position:relative; width:138px; height:138px; border-radius:50%;
  background:var(--card-bg);
  border:1.5px solid var(--border);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  cursor:pointer; color:var(--fg3); overflow:visible;
  transition: color .3s, border-color .3s, background .3s, transform .25s, box-shadow .3s;
}
.role-btn:hover {
  color:var(--fg2);
  border-color:rgba(139,92,246,0.45);
  background:rgba(139,92,246,0.1);
  transform:translateY(-5px) scale(1.04);
}
.role-btn.active {
  color:var(--purple-hi);
  border-color:rgba(139,92,246,0.72);
  background:var(--purple-lo);
  transform:translateY(-5px) scale(1.05);
  box-shadow: 0 0 38px rgba(139,92,246,0.3), inset 0 0 22px rgba(139,92,246,0.07);
}
/* outer pulse ring when active */
.role-ring {
  position:absolute; inset:-10px; border-radius:50%;
  border:1.5px solid rgba(139,92,246,0.36);
  opacity:0; animation:roleRingAnim 2.4s ease-in-out infinite; pointer-events:none;
}
.role-btn.active .role-ring { opacity:1; }
@keyframes roleRingAnim {
  0%,100% { transform:scale(1); opacity:0.36; }
  50%      { transform:scale(1.07); opacity:0; }
}
.role-icon { width:52px; height:52px; margin-bottom:24px; }
.role-icon svg { width:100%; height:100%; }
.role-label {
  position:absolute; bottom:15px;
  font-family:'Space Mono',monospace; font-size:0.5rem;
  letter-spacing:0.14em; font-weight:700; white-space:nowrap;
}

/* ── NEXT STEP BUTTON ── */
.next-btn {
  display:inline-flex; align-items:center; gap:0.9rem;
  padding:0.9rem 2.8rem;
  background:var(--card-bg);
  border:1px solid var(--border);
  border-radius:10px;
  font-family:'Space Mono',monospace; font-size:0.68rem;
  letter-spacing:0.22em; color:var(--fg2);
  cursor:pointer;
  transition: background .28s, border-color .28s, color .28s, transform .2s, box-shadow .28s;
  backdrop-filter:blur(10px);
}
.next-btn:hover {
  background:var(--purple-lo); border-color:rgba(139,92,246,0.55); color:var(--fg);
  transform:translateY(-2px);
}
.next-btn.ready {
  border-color:rgba(139,92,246,0.72);
  background:var(--purple-lo); color:var(--fg);
  box-shadow: 0 4px 26px var(--shadow);
}
.next-btn.shake { animation:shake .38s ease; }
@keyframes shake {
  0%,100%{transform:translateX(0);}
  20%{transform:translateX(-7px);}
  40%{transform:translateX(7px);}
  60%{transform:translateX(-4px);}
  80%{transform:translateX(4px);}
}

/* ── BACK TO HOME LINK ── */
.back-home {
  display:inline-flex; align-items:center; gap:0.4rem;
  background:none; border:none; cursor:pointer; text-decoration:none;
  font-family:'DM Sans',sans-serif; font-size:0.8rem;
  color:var(--fg3); transition:color .2s;
}
.back-home:hover { color:var(--purple-hi); }

/* ── VERIFIED PILL ── */
.verified-pill {
  display:inline-flex; align-items:center; gap:0.4rem;
  font-family:'Space Mono',monospace; font-size:0.58rem; letter-spacing:0.12em;
  padding:0.3rem 0.8rem; border-radius:100px;
  background:var(--teal-lo); color:var(--teal); border:1px solid rgba(16,217,168,0.2);
}

/* ── LIGHT MODE: dim/hide dark-only bg elements ── */
[data-theme="light"] #star-canvas { opacity:0.06; }
[data-theme="light"] .blob-1 { background:radial-gradient(circle,rgba(124,58,237,0.14) 0%,transparent 70%); }
[data-theme="light"] .blob-2 { background:radial-gradient(circle,rgba(13,148,136,0.10) 0%,transparent 70%); }
[data-theme="light"] .blob-3 { background:radial-gradient(circle,rgba(124,58,237,0.06) 0%,transparent 70%); }
[data-theme="light"] .nebula { opacity:0.1; }
[data-theme="light"] .planet {
  background: radial-gradient(circle at 36% 30%, #d8d0ff 0%, #c4b8f8 35%, #b8a8f5 60%, #a899ef 100%);
  box-shadow: inset -50px -50px 90px rgba(124,58,237,0.2), inset 18px 18px 70px rgba(255,255,255,0.5),
              0 0 160px rgba(124,58,237,0.08), 0 0 60px rgba(124,58,237,0.05);
}
[data-theme="light"] .planet-ring { border-color:rgba(13,148,136,0.15); }
[data-theme="light"] .mascot-glow { background:radial-gradient(circle,rgba(124,58,237,0.1) 0%,transparent 70%); }
[data-theme="light"] html, [data-theme="light"] body { background:var(--bg); color:var(--fg); }
[data-theme="light"] .role-btn { background:rgba(255,255,255,0.7); }
[data-theme="light"] .brand-name { color:var(--purple-hi); }
[data-theme="light"] .brand-sub { color:var(--fg2); }
[data-theme="light"] .subtitle { color:var(--teal); border-color:rgba(13,148,136,0.25); background:var(--teal-lo); }
[data-theme="light"] .next-btn { background:linear-gradient(135deg,rgba(124,58,237,0.12),rgba(13,148,136,0.1)); border-color:rgba(124,58,237,0.3); color:var(--fg); }
[data-theme="light"] .next-btn.ready { background:linear-gradient(135deg,rgba(124,58,237,0.25),rgba(13,148,136,0.18)); }
[data-theme="light"] .back-home { color:var(--fg2); }
[data-theme="light"] .logo-icon-big { background:var(--purple-lo); border-color:var(--border); }
[data-theme="light"] .logo-ring { border-color:rgba(124,58,237,0.2); }
[data-theme="light"] .logo-ring-2 { border-color:rgba(13,148,136,0.15); }
[data-theme="light"] nav { background:var(--nav-bg); border-bottom-color:var(--border); }
[data-theme="light"] .nav-pill { background:var(--purple-lo); color:var(--purple-hi); border-color:var(--border); }
[data-theme="light"] .logo-text { color:var(--fg); }
[data-theme="light"] .back-btn { color:var(--fg2); }
[data-theme="light"] .verified-pill { background:var(--teal-lo); color:var(--teal); border-color:rgba(13,148,136,0.25); }
[data-theme="light"] .logo-mascot { filter: drop-shadow(0 18px 50px rgba(124,58,237,0.3)) drop-shadow(0 0 30px rgba(13,148,136,0.15)); }
</style>
</head>
<body>

<!-- Background layers -->
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>
<canvas id="star-canvas"></canvas>
<div class="nebula"></div>
<div class="planet"></div>
<div class="planet-ring"></div>

<!-- Glow behind mascot -->
<div class="mascot-glow"></div>
<!-- Orbiting teal dot -->
<div class="orbit-dot"></div>

<!-- Animated Campus ReShare Hub Logo Mascot -->
<div class="logo-mascot">
  <svg viewBox="0 0 220 230" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- green gradient for ring & left figure -->
      <radialGradient id="greenGrad" cx="50%" cy="30%" r="70%">
        <stop offset="0%"   stop-color="#4ade80"/>
        <stop offset="100%" stop-color="#16a34a"/>
      </radialGradient>
      <!-- blue gradient for right figure -->
      <radialGradient id="blueGrad" cx="40%" cy="30%" r="70%">
        <stop offset="0%"   stop-color="#60a5fa"/>
        <stop offset="100%" stop-color="#1d4ed8"/>
      </radialGradient>
      <!-- cap gradient -->
      <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%"   stop-color="#3b82f6"/>
        <stop offset="100%" stop-color="#1e40af"/>
      </linearGradient>
      <!-- purple glow filter -->
      <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="4" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="softglow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="2.5" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>

    <!-- ── RECYCLING RING (spinning) ── -->
    <g class="ring-spin" filter="url(#softglow)">
      <!-- ring base circle (faint) -->
      <circle cx="110" cy="115" r="72" fill="none" stroke="rgba(22,163,74,0.2)" stroke-width="10"/>

      <!-- Arrow 1: top-right arc -->
      <path d="M110 45 A70 70 0 0 1 168 87"
            fill="none" stroke="url(#greenGrad)" stroke-width="11" stroke-linecap="round"/>
      <polygon points="170,80 178,95 162,91" fill="#16a34a"/>

      <!-- Arrow 2: bottom arc -->
      <path d="M168 143 A70 70 0 0 1 52 143"
            fill="none" stroke="url(#greenGrad)" stroke-width="11" stroke-linecap="round"/>
      <polygon points="48,149 42,134 57,137" fill="#16a34a"/>

      <!-- Arrow 3: left arc back up -->
      <path d="M52 87 A70 70 0 0 1 110 45"
            fill="none" stroke="url(#greenGrad)" stroke-width="11" stroke-linecap="round"/>
      <polygon points="116,40 103,34 105,49" fill="#16a34a"/>
    </g>

    <!-- ── LEFT FIGURE (green student) ── -->
    <g class="fig-left" filter="url(#softglow)">
      <!-- head -->
      <circle cx="96" cy="100" r="11" fill="url(#greenGrad)"/>
      <!-- body / wings -->
      <path d="M96 111 C75 118 68 138 82 148 C92 154 96 148 96 148"
            fill="url(#greenGrad)" opacity="0.9"/>
      <path d="M96 111 C100 122 100 138 96 148"
            fill="rgba(22,163,74,0.5)"/>
    </g>

    <!-- ── RIGHT FIGURE (blue student) ── -->
    <g class="fig-right" filter="url(#softglow)">
      <!-- head -->
      <circle cx="124" cy="100" r="11" fill="url(#blueGrad)"/>
      <!-- body / wings -->

<script>
/* ── STARFIELD (matching main page style) ── */
const canvas = document.getElementById('star-canvas');
const ctx    = canvas.getContext('2d');
let stars    = [];

function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  buildStars();
}

function buildStars() {
  stars = Array.from({ length: 280 }, () => ({
    x:    Math.random(),
    y:    Math.random(),
    r:    0.2 + Math.random() * 1.55,
    a:    0.12 + Math.random() * 0.78,
    sp:   0.2  + Math.random() * 0.85,
    ph:   Math.random() * Math.PI * 2,
    warm: Math.random() > 0.78
  }));
}

function draw(t) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const T = t * 0.001;
  stars.forEach(s => {
    const tw = s.a * (0.58 + 0.42 * Math.sin(T * s.sp + s.ph));
    ctx.beginPath();
    ctx.arc(s.x * canvas.width, s.y * canvas.height, s.r, 0, Math.PI * 2);
    // warm-tinted (purple haze) near top-right planet zone
    const isWarmZone = s.x > 0.52 && s.y < 0.52;
    ctx.fillStyle = (s.warm && isWarmZone)
      ? `rgba(200,180,255,${tw * 0.75})`
      : `rgba(255,255,255,${tw})`;
    ctx.fill();
  });
  requestAnimationFrame(draw);
}

resize();
window.addEventListener('resize', resize);
requestAnimationFrame(draw);

/* ── ROLE SELECTION ── */
let selected = null;

function selectRole(role) {
  selected = role;
  document.getElementById('btn-leader').classList.toggle('active', role === 'leader');
  document.getElementById('btn-member').classList.toggle('active', role === 'member');
  document.getElementById('next-btn').classList.add('ready');
}

function handleNext() {
  if (!selected) {
    const btn = document.getElementById('next-btn');
    btn.classList.remove('shake');
    void btn.offsetWidth;
    btn.classList.add('shake');
    ['btn-leader','btn-member'].forEach(id => {
      const el = document.getElementById(id);
      el.style.borderColor = 'rgba(139,92,246,0.7)';
      setTimeout(() => el.style.borderColor = '', 700);
    });
    return;
  }
  if (selected === 'leader') {
    localStorage.setItem('reshare_role', 'admin');
    window.location.href = 'login.html';
  } else {
    localStorage.setItem('reshare_role', 'student');
    window.location.href = 'student-login.html';
  }
}
</script>

<script>
(function(){
  var t = localStorage.getItem('theme') || 'dark';
  document.documentElement.setAttribute('data-theme', t);
  var btn = document.getElementById('themeBtn');
  if (btn) btn.textContent = t === 'dark' ? '☀️' : '🌙';
})();
function toggleTheme() {
  var html = document.documentElement;
  var next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  var btn = document.getElementById('themeBtn');
  if (btn) btn.textContent = next === 'dark' ? '☀️' : '🌙';
}
</script>
